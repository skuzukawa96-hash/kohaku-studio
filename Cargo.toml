[workspace]
members = ["crates/bi-core", "crates/bi-connectors", "crates/bi-analytics", "crates/bi-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# 低スペックPC向け最適化: サイズと速度のバランス、実行時メモリ最小化
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
